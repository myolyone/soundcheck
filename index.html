<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>3D Noise Bouncy Balls</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
        #startBtn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px; font-size: 20px; font-weight: bold;
            background: #2563eb; color: white; border: none;
            border-radius: 50px; cursor: pointer; z-index: 10;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
</head>
<body>

    <button id="startBtn">เปิดไมค์และเริ่มเล่น 3D</button>

    <script>
        let scene, camera, renderer, world;
        let balls = [];
        let audioContext, analyser, dataArray;
        const numBalls = 40;

        const startBtn = document.getElementById('startBtn');

        function init() {
            // 1. สร้าง Three.js Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 2. สร้าง Cannon.js Physics World
            world = new CANNON.World();
            world.gravity.set(0, -18, 0); // แรงโน้มถ่วงแนวตั้ง

            // สร้างวัสดุฟิสิกส์ให้ลูกบอลมีความเด้งสูง (Restitution = 0.8)
            const defaultMaterial = new CANNON.Material('default');
            const defaultContactMaterial = new CANNON.ContactMaterial(
                defaultMaterial, defaultMaterial, { friction: 0.1, restitution: 0.8 }
            );
            world.addContactMaterial(defaultContactMaterial);

            // สร้างกล่องขอบเขตกันลูกบอลกระเด็นออกนอกจอ (Boundaries)
            createWall(0, -5, 0, 30, 1, 20);  // พื้น
            createWall(-12, 10, 0, 1, 30, 20); // กำแพงซ้าย
            createWall(12, 10, 0, 1, 30, 20);  // กำแพงขวา
            createWall(0, 10, -5, 30, 30, 1);  // ด้านหลัง

            // สุ่มสร้างลูกบอล 3D
            for (let i = 0; i < numBalls; i++) {
                createBall(defaultMaterial);
            }

            window.addEventListener('resize', onWindowResize);
        }

        function createWall(x, y, z, w, h, d) {
            const body = new CANNON.Body({
                mass: 0, // Mass = 0 เพื่อให้วัตถุอยู่นิ่งไม่ตกลงมา
                shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2))
            });
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function createBall(material) {
            const radius = Math.random() * 0.5 + 0.6;
            
            // 3D Mesh (Three.js)
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const color = new THREE.Color(`hsl(${Math.random() * 360}, 85%, 60%)`);
            const THREE_Material = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.1, 
                metalness: 0.1 
            });
            const mesh = new THREE.Mesh(geometry, THREE_Material);
            mesh.castShadow = true;
            scene.add(mesh);

            // Physics Body (Cannon.js)
            const body = new CANNON.Body({
                mass: 1,
                shape: new CANNON.Sphere(radius),
                material: material
            });
            body.position.set(
                (Math.random() - 0.5) * 10,
                Math.random() * 10 + 2,
                (Math.random() - 0.5) * 4
            );
            world.addBody(body);

            balls.push({ mesh, body });
        }

        // ระบบรับเสียงจากไมโครโฟน
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 128;
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                startBtn.style.display = 'none';
                animate();
            } catch (err) {
                alert('ไม่สามารถเปิดใช้งานไมโครโฟนได้: ' + err);
            }
        }

        function getVolume() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            return sum / dataArray.length;
        }

        // Main Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            world.step(1 / 60, delta, 3); // อัปเดตโลกฟิสิกส์

            const volume = getVolume();

            // ถ้ามีเสียงดัง ให้ส่งแรง Impulse ผลักลูกบอลขึ้นด้านบน
            balls.forEach(ball => {
                if (volume > 15) {
                    const force = (volume / 255) * (Math.random() * 12 + 8);
                    ball.body.applyImpulse(
                        new CANNON.Vec3((Math.random() - 0.5) * 2, force, (Math.random() - 0.5) * 2),
                        ball.body.position
                    );
                }

                // ซิงค์ตำแหน่งและระนาบหมุนจาก Physics สู่ 3D Graphic
                ball.mesh.position.copy(ball.body.position);
                ball.mesh.quaternion.copy(ball.body.quaternion);
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        startBtn.addEventListener('click', initAudio);
    </script>
</body>
</html>
